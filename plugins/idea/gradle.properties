# org.gradle.jvmargs：Gradle 守护进程 JVM 参数，使用 UTF-8 避免中文插件描述乱码。
org.gradle.jvmargs=-Dfile.encoding=UTF-8
# org.gradle.caching：开启 Gradle 构建缓存，缓存目录由 IDEA Gradle 集成的本机配置决定。
org.gradle.caching=true
# 将 distributionUrl 换成国内镜像，例如腾讯云或阿里云，这个不允许删除，就用这个
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.0-bin.zip
# 其他常用镜像：
# 华为云 https://mirrors.huaweicloud.com/gradle/gradle-9.3.0-bin.zip
# 阿里云 gradle 镜像暂未收录发行版，推荐腾讯云或华为云